name: Test Magento security patches

env:
  PATCH_PACKAGE_NAME: "medigeek/magento-ce-security-patches-247"
  MAGENTO_VERSION: "2.4.7-p10"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
  
      - name: Validate composer.json and composer.lock
        run: composer validate --strict
  
      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-
  
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, gd, xml, bcmath, pdo_mysql, zip, curl
          tools: composer:v2
  
      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
  
      - name: Set Composer Authentication
        run: |
          mkdir -p ~/.composer
          echo '${{ secrets.COMPOSER_AUTH }}' > ~/.composer/auth.json
  
      - name: Require Patch Dependency & Install
        run: |
          # 1. Set global repo & plugin permissions (runs outside magento-dir)
          composer config --global repositories.magento composer https://repo.magento.com/
          composer config --global repositories.medigeek-patches vcs "https://github.com/${PATCH_PACKAGE_NAME}.git"

          composer config --global 'allow-plugins.cweagans/composer-patches' true
          composer config --global 'allow-plugins.magento/*' true
          composer config --global 'allow-plugins.dealerdirect/phpcodesniffer-composer-installer' true
          composer config --global 'allow-plugins.laminas/laminas-dependency-plugin' true
          composer config --global 'allow-plugins.php-http/discovery' true

          # 2. Extract skeleton using project-community-edition (NOT product-community-edition)
          composer create-project --repository-url=https://repo.magento.com/ \
            magento/project-community-edition:${MAGENTO_VERSION} magento-dir --no-install --no-interaction

          # 3. Enter directory to set local extra configuration and requirements
          cd magento-dir

          composer config extra.magento-force override
          composer config extra.composer-exit-on-patch-failure true
          composer config extra.composer-patches.default-patch-depth 4

          composer require "${PATCH_PACKAGE_NAME}:dev-main" --no-update

          # 4. Perform single install pass
          composer install --prefer-dist --no-progress --no-interaction -vvv

      - name: Verify Patches Applied Successfully
        run: |
          # Check if cweagans plugin applied patches by verifying vendor file changes or checking composer output
          cd magento-dir
          php bin/magento --version

