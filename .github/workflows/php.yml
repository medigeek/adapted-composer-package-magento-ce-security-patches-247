name: Test Magento security patches

env:
  PATCH_PACKAGE_NAME: "medigeek/magento-ce-security-patches-247"
  MAGENTO_VERSION: "2.4.7-p10"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
  
      - name: Validate composer.json and composer.lock
        run: composer validate --strict
  
      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-
  
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, gd, xml, bcmath, pdo_mysql, zip, curl
          tools: composer:v2
  
      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
  
      - name: Set Composer Authentication
        run: |
          mkdir -p ~/.composer
          echo '${{ secrets.COMPOSER_AUTH }}' > ~/.composer/auth.json
  
      - name: Require Patch Dependency & Install
        run: |
          # 1. Create directory and initialize a clean root composer.json
          mkdir magento-dir
          cd magento-dir
          composer init --name="test/magento-test-app" --no-interaction

          # 2. Add repo.magento.com and your local patch package repository
          composer config repositories.magento composer https://repo.magento.com/
          composer config repositories.local-security-patches path "../"

          # 3. Allow required plugins using proper single-quotes
          composer config 'allow-plugins.cweagans/composer-patches' true
          composer config 'allow-plugins.magento/*' true
          composer config 'allow-plugins.dealerdirect/phpcodesniffer-composer-installer' true
          composer config 'allow-plugins.laminas/laminas-dependency-plugin' true
          composer config 'allow-plugins.php-http/discovery' true

          # 4. Require Magento CE $MAGENTO_VERSION and your patch package without running an immediate install
          composer require "magento/product-community-edition:${MAGENTO_VERSION}" --no-update
          composer require "${PATCH_PACKAGE_NAME}:@dev" --no-update

          # 5. Run full install (downloads Magento core + triggers cweagans patching)
          composer install --prefer-dist --no-progress --no-interaction

      - name: Verify Patches Applied Successfully
        run: |
          # Check if cweagans plugin applied patches by verifying vendor file changes or checking composer output
          php bin/magento --version

