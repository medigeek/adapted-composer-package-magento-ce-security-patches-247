name: Update Patches Lockfile

#on:
#  push:
#    branches:
#      - main
#    paths:
#      - 'composer.json'
#      - 'patches/**'
#  workflow_dispatch: # Allows manual trigger from GitHub UI

on:
  workflow_call: # Exposes this file to be called by other workflows

jobs:
  update-lockfile:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required to push commits back to the repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Allow Patch Plugin
        run: |
          composer config 'allow-plugins.cweagans/composer-patches' true

      - name: Run Composer Install to Generate Lockfile
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          composer patches-relock

      - name: Commit and Push Updated patches.lock.json
        run: |
          # Check if patches.lock.json exists on the filesystem
          if [ -f "patches.lock.json" ]; then
            
            # Check if Git sees it as modified OR untracked (first time)
            if [ -n "$(git status --porcelain patches.lock.json)" ]; then
              echo "Detected new or modified patches.lock.json. Committing..."

              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"

              # Stage specifically patches.lock.json
              git add patches.lock.json
              
              # Commit and push
              git commit -m "chore(ci): update patches.lock.json [skip ci]"
              git push origin ${{ github.ref_name }}
            else
              echo "patches.lock.json exists and is up to date."
            fi

          else
            echo "No patches.lock.json was generated during composer install."
          fi
